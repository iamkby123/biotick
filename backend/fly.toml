app = 'biotick-api'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile.fly"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[env]
  PORT = "8000"
